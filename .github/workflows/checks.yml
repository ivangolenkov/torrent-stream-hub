name: Checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.8"
  NODE_VERSION: "22.15.0"

jobs:
  linux:
    name: Linux integration, race, frontend and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            pkg/anacrolix-torrent/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make deps
      - run: make check
      - name: Resume syscall measurement parser
        run: python3 -m unittest discover -s scripts -p test_summarize_resume_syncs.py

  storage:
    name: Native storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: pkg/anacrolix-torrent/go.sum
      - name: Publication, reopen, ownership and verification
        working-directory: pkg/anacrolix-torrent
        run: go test -race -count=1 ./storage
      - name: Storage vet
        working-directory: pkg/anacrolix-torrent
        run: go vet ./storage
      - name: Native verification queue and opening lifecycle
        working-directory: pkg/anacrolix-torrent
        run: go test -race -count=1 . -run 'TestVerification|TestSelectiveVerification|TestBlockedStorageOpen|TestHashBudget|TestTypeSizes|TestPendingStorage|TestFileCheckpoint'
      - name: Native names and volume markers
        run: go test -race -count=1 ./internal/payload
      - name: Native resume checkpoints, crash barriers and instance ownership
        run: go test -race -count=1 ./internal/fastresume ./internal/repository ./internal/engine -run 'TestCodec|TestResume|TestAbsentStartup|TestEngineInstance|TestStorageConversion|TestSealWorker|TestStorageFinalizer' -timeout=240s
      - name: Native recovery journals, ownership and deletion lifecycle
        run: go test -race -count=1 ./internal/repository ./internal/usecase -run 'TestLegacyRecovery|TestDeletionCancel|TestOwnership|TestStorage|TestRecovery|TestInventory|TestNamed|TestMagnet|TestFileProjection|TestApplicationResumeProducer|TestCoordinator.*Drain|TestResumeApplication|TestResumeSelection|TestResumeLegacyFailed|TestResumeMutation'
      - name: Native installed resume, periodic/shutdown and HTTP Range
        run: go test -race -count=1 ./internal/usecase ./internal/delivery/http/api -run 'TestResumeRuntime|TestProductionResume' -timeout=180s
